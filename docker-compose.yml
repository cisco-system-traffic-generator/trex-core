services:
  trex:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    image: trex-core:local
    container_name: trex
    privileged: true
    cap_add:
      - ALL
    stdin_open: true
    tty: true
    tmpfs:
      - /mnt/huge
    environment:
      TREX_CFG: /etc/trex_cfg.yaml
